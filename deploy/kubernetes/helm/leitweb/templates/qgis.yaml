apiVersion: v1
kind: Service
metadata:
  name: {{ include "leitweb.fullname" . }}-qgis-server
  labels:
    {{- include "leitweb.labels" . | nindent 4 }}
    app.kubernetes.io/component: qgis-server
spec:
  selector:
    {{- include "leitweb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: qgis-server
  ports:
    - { name: fastcgi, port: 5555, targetPort: fastcgi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leitweb.fullname" . }}-qgis-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "leitweb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qgis-server
  template:
    metadata:
      labels:
        {{- include "leitweb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: qgis-server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: qgis-server
          image: "{{ .Values.images.qgis.repository }}:{{ .Values.images.qgis.tag }}"
          imagePullPolicy: {{ .Values.images.qgis.pullPolicy }}
          ports:
            - { name: fastcgi, containerPort: 5555 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - { name: PGHOST, value: "{{ include "leitweb.fullname" . }}-postgres" }
            - { name: PGDATABASE, value: leitweb }
            - { name: PGUSER, value: leitweb }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password } }
            - { name: PGSSLMODE, value: prefer }
            - { name: QGIS_PROJECT_FILE, value: {{ .Values.qgis.projectFile | quote }} }
            - { name: QGIS_SERVER_LOG_LEVEL, value: {{ .Values.qgis.logLevel | quote }} }
          readinessProbe:
            tcpSocket: { port: fastcgi }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: fastcgi }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.qgis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "leitweb.fullname" . }}-qgis-web
  labels:
    {{- include "leitweb.labels" . | nindent 4 }}
    app.kubernetes.io/component: qgis-web
spec:
  selector:
    {{- include "leitweb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: qgis-web
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leitweb.fullname" . }}-qgis-web
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "leitweb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qgis-web
  template:
    metadata:
      labels:
        {{- include "leitweb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: qgis-web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: nginx
          image: "{{ .Values.images.nginx.repository }}:{{ .Values.images.nginx.tag }}"
          imagePullPolicy: {{ .Values.images.nginx.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - name: config
          configMap: { name: {{ include "leitweb.fullname" . }}-qgis-nginx }

