apiVersion: v1
kind: Service
metadata:
  name: {{ include "leitweb.fullname" . }}-postgres
  labels:
    {{- include "leitweb.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "leitweb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "leitweb.fullname" . }}-postgres
  labels:
    {{- include "leitweb.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "leitweb.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "leitweb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "leitweb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: leitweb }
            - { name: POSTGRES_USER, value: leitweb }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password } }
          readinessProbe:
            exec: { command: [sh, -c, "pg_isready -U leitweb -d leitweb"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: [sh, -c, "pg_isready -U leitweb -d leitweb"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/01-create-keycloak.sh, subPath: 01-create-keycloak.sh, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-postgres" (include "leitweb.fullname" .)) .Values.postgres.existingClaim }}
        - name: init
          configMap:
            name: {{ include "leitweb.fullname" . }}-postgres-init
            defaultMode: 0555

