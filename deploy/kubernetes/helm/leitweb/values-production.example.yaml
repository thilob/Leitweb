# Copy to a file outside Git or rename locally and adapt all values.
images:
  api:
    repository: ghcr.io/thilob/leitweb-api
    tag: "sha-f8fa102"
    pullPolicy: IfNotPresent
  qgis:
    repository: ghcr.io/thilob/leitweb-qgis
    tag: "sha-f8fa102"
    pullPolicy: IfNotPresent

existingSecret: leitweb-secrets

publicUrls:
  leitweb: https://leitweb.example.org
  keycloak: https://auth.example.org
  qgis: https://qgis.example.org/ows

postgres:
  # Empty means: use the cluster's default StorageClass. K3s normally provides
  # local-path; set longhorn explicitly only when it is installed and desired.
  storageClassName: ""
  storageSize: 50Gi

ingress:
  # Use the IngressClass installed in the target cluster.
  className: traefik
  # If Rancher's cert-manager already has a suitable ClusterIssuer, it can
  # create the TLS secret named below. Replace the issuer name as required.
  annotations: {}
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: leitweb-tls
  hosts:
    leitweb: leitweb.example.org
    keycloak: auth.example.org
    qgis: qgis.example.org

