nameOverride: ""
fullnameOverride: ""

images:
  api: { repository: ghcr.io/thilob/leitweb-api, tag: kubernetes, pullPolicy: Always }
  qgis: { repository: ghcr.io/thilob/leitweb-qgis, tag: kubernetes, pullPolicy: Always }
  postgres: { repository: postgis/postgis, tag: 16-3.5-alpine, pullPolicy: IfNotPresent }
  keycloak: { repository: quay.io/keycloak/keycloak, tag: 26.7.3, pullPolicy: IfNotPresent }
  nginx: { repository: nginx, tag: 1.30-alpine, pullPolicy: IfNotPresent }

# Create this secret before the Helm installation; see README.md.
existingSecret: leitweb-secrets
imagePullSecrets: []

publicUrls:
  leitweb: https://leitweb.example.org
  keycloak: https://auth.example.org
  qgis: https://qgis.example.org/ows

initialDataSeed: false
requireHttpsMetadata: true

api:
  # Keep this at 1 until LiveUpdateHub has a distributed backplane.
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

postgres:
  storageClassName: ""
  storageSize: 20Gi
  existingClaim: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 2Gi }

keycloak:
  replicas: 1
  adminUsername: admin
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

qgis:
  projectFile: /projects/start.qgz
  logLevel: "1"
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

ingress:
  enabled: true
  className: nginx
  annotations: {}
  tls: { enabled: true, secretName: leitweb-tls }
  hosts:
    leitweb: leitweb.example.org
    keycloak: auth.example.org
    qgis: qgis.example.org

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
