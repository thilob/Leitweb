# Copy this file to 01-secret.yaml, replace every CHANGE-ME value and apply it.
# Never commit the populated file.
apiVersion: v1
kind: Secret
metadata:
  name: leitweb-secrets
  namespace: leitweb
type: Opaque
stringData:
  postgres-password: CHANGE-ME-long-random-database-password
  keycloak-admin-password: CHANGE-ME-different-long-random-admin-password
  keycloak-client-secret: CHANGE-ME-keycloak-service-account-secret

