name: dorfpolizei-well-gis

services:
  database:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leitweb
      POSTGRES_USER: leitweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt werden}
    volumes:
      - gis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leitweb -d leitweb"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]

  database-init:
    image: postgis/postgis:16-3.5-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGUSER: leitweb
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt werden}
    volumes:
      - ./deploy/postgres/ensure-keycloak-db.sh:/ensure-keycloak-db.sh:ro
    command: ["/bin/sh", "/ensure-keycloak-db.sh"]
    depends_on:
      database:
        condition: service_healthy
    networks: [backend]

  identity:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: leitweb
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt werden}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD muss gesetzt werden}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL muss gesetzt werden}
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./deploy/keycloak/leitweb-realm.json:/opt/keycloak/data/import/leitweb-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 300s
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      InitialData__Seed: ${INITIAL_DATA_SEED:-true}
      ConnectionStrings__Database: Host=database;Port=5432;Database=leitweb;Username=leitweb;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt werden};Search Path=public
      Authentication__Authority: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL muss gesetzt werden}/realms/leitweb
      Authentication__PublicAuthority: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL muss gesetzt werden}/realms/leitweb
      Authentication__MetadataAddress: http://identity:8080/realms/leitweb/.well-known/openid-configuration
      Authentication__Audience: leitweb-api
      Authentication__ClientId: leitweb-api
      Authentication__RequireHttpsMetadata: ${REQUIRE_HTTPS_METADATA:-false}
      KeycloakAdmin__BaseUrl: http://identity:8080
      KeycloakAdmin__Realm: leitweb
      KeycloakAdmin__ClientId: leitweb-user-admin
      KeycloakAdmin__ClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      Gis__QgisServerUrl: http://qgis-web:8080/ows
      Gis__QgisPublicUrl: ${QGIS_PUBLIC_URL:-http://localhost:${QGIS_PORT:-8090}/ows}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    ports:
      - "${LEITWEB_PORT:-5000}:8080"
    depends_on:
      database:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

  qgis-server:
    build:
      context: ./deploy/qgis-server
    restart: unless-stopped
    environment:
      PGHOST: database
      PGDATABASE: leitweb
      PGUSER: leitweb
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt werden}
      PGSSLMODE: ${POSTGRES_SSLMODE:-prefer}
      QGIS_PROJECT_FILE: ${QGIS_PROJECT_FILE:-/projects/start.qgz}
      QGIS_SERVER_LOG_LEVEL: ${QGIS_SERVER_LOG_LEVEL:-1}
    volumes:
      - ./deploy/qgis-server/projects:/projects:ro
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [backend]

  qgis-web:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${QGIS_PORT:-8090}:8080"
    volumes:
      - ./deploy/qgis-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      qgis-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/ows?SERVICE=WMS&REQUEST=GetCapabilities"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [backend]

volumes:
  gis-postgres-data:
    name: dorfpolizei-well-gis-data

networks:
  backend:
    name: dorfpolizei-well-gis-backend
