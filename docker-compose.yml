name: dorfpolizei-well

services:
  database:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leitweb
      POSTGRES_USER: leitweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leitweb -d leitweb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  identity:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: leitweb
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-this-admin-password}
      KC_HOSTNAME: http://${PUBLIC_HOSTNAME:-localhost}:${KEYCLOAK_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro,Z
    depends_on:
      database-init:
        condition: service_completed_successfully

  database-init:
    image: postgis/postgis:16-3.5-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGUSER: leitweb
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - ./deploy/postgres/ensure-keycloak-db.sh:/ensure-keycloak-db.sh:ro,Z
    command: ["/bin/sh", "/ensure-keycloak-db.sh"]
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: ./src/Leitweb.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Development__UseInMemoryDatabase: "false"
      Development__UseTestAuthentication: "true"
      InitialData__Seed: "true"
      ConnectionStrings__Database: Host=database;Port=5432;Database=leitweb;Username=leitweb;Password=${POSTGRES_PASSWORD:-change-this-database-password}
      Authentication__Authority: http://${PUBLIC_HOSTNAME:-localhost}:${KEYCLOAK_PORT:-8080}/realms/leitweb
      Authentication__MetadataAddress: http://identity:8080/realms/leitweb/.well-known/openid-configuration
      Authentication__Audience: leitweb-api
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "${LEITWEB_PORT:-5000}:8080"
    depends_on:
      database:
        condition: service_healthy
      identity:
        condition: service_started

  qgis-server:
    build: ./deploy/qgis-server
    restart: unless-stopped
    environment:
      PGHOST: database
      PGDATABASE: leitweb
      PGUSER: leitweb
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      QGIS_PROJECT_FILE: /projects/leitweb.qgs
    volumes:
      - ./deploy/qgis-server/projects:/projects:ro,Z
    depends_on:
      database:
        condition: service_healthy

  qgis-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${QGIS_PORT:-8090}:8080"
    volumes:
      - ./deploy/qgis-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - qgis-server

volumes:
  postgres-data:
    name: dorfpolizei-well-data
