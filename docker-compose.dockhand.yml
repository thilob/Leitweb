name: leitweb

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leitweb
      POSTGRES_USER: leitweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in Dockhand gesetzt werden}
    volumes:
      - leitweb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leitweb -d leitweb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  identity:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: leitweb
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in Dockhand gesetzt werden}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD muss in Dockhand gesetzt werden}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./deploy/keycloak/leitweb-realm.json:/opt/keycloak/data/import/leitweb-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks:
      - backend

  database-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGUSER: leitweb
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in Dockhand gesetzt werden}
    volumes:
      - ./deploy/postgres/ensure-keycloak-db.sh:/ensure-keycloak-db.sh:ro
    command: ["/bin/sh", "/ensure-keycloak-db.sh"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      InitialData__Seed: ${INITIAL_DATA_SEED:-true}
      ConnectionStrings__Database: Host=database;Port=5432;Database=leitweb;Username=leitweb;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in Dockhand gesetzt werden};Search Path=public
      Authentication__Authority: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/leitweb
      Authentication__PublicAuthority: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/leitweb
      Authentication__MetadataAddress: http://identity:8080/realms/leitweb/.well-known/openid-configuration
      Authentication__Audience: leitweb-api
      Authentication__ClientId: leitweb-api
      Authentication__RequireHttpsMetadata: ${REQUIRE_HTTPS_METADATA:-false}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    ports:
      - "${LEITWEB_PORT:-5000}:8080"
    depends_on:
      database:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      - backend

volumes:
  leitweb-postgres:

networks:
  backend:
