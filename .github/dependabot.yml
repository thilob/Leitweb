version: 2

updates:
  - package-ecosystem: nuget
    directory: /src/Leitweb.Api
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directories:
      - /
      - /src/Leitweb.Api
      - /deploy/qgis-server
      - /deploy/kubernetes/plain
      - /deploy/kubernetes/helm/leitweb
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: postgis/postgis
        update-types:
          - version-update:semver-major
    groups:
      container-images:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: postgis/postgis
        update-types:
          - version-update:semver-major
    groups:
      compose-images:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 10
